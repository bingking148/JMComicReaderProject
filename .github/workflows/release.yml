name: Release

on:
  push:
    tags:
      - "v2.2.0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.12"
          cache-dependency-path: engine/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Android SDK packages
        run: |
          set -eu
          if [ -z "${ANDROID_SDK_ROOT:-}${ANDROID_HOME:-}" ]; then
            echo "Android SDK is not installed on this runner" >&2
            exit 1
          fi
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Build arm64 APK
        run: |
          set -eu
          bash scripts/build-android-engine.sh
          cd app
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/JMComicReader-2.2.0-arm64.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: JMComicReader-2.2.0-arm64.apk
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.12"
          cache-dependency-path: engine/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Build engine and Flutter window
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          New-Item -ItemType Directory -Force -Path app\bin | Out-Null
          go build -C engine -trimpath -ldflags "-s -w" -o ..\app\bin\jmengine.exe .\cmd\jmengine
          Set-Location app
          flutter config --enable-windows-desktop
          flutter build windows --release
          Set-Location ..
          $release = "app\build\windows\x64\runner\Release"
          if (-not (Test-Path "$release\JMComicReader.exe")) { throw "Missing JMComicReader.exe" }
          if (-not (Test-Path "$release\jmengine.exe")) { throw "Missing bundled jmengine.exe" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc /DAppVersion=2.2.0 "app\windows\installer\JMComicReader.iss"
          if (-not (Test-Path "dist\JMComicReader-Setup-v2.2.0.exe")) { throw "Installer was not produced" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: dist/JMComicReader-Setup-v2.2.0.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: List release files
        run: find release-files -type f -printf '%s %p\n'

      - name: Publish v2.2.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.0
          name: JMComicReader v2.2.0
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          files: |
            release-files/android-apk/JMComicReader-2.2.0-arm64.apk
            release-files/windows-setup/JMComicReader-Setup-v2.2.0.exe
          body: |
            JMComicReader 2.2.0。桌面和 Android 都是独立应用：Go 引擎在本机进程里，Flutter 负责窗口和阅读。不需要 Python，也不需要另一台电脑上的服务。使用前需确认已年满 18 岁。

            相对 2.1.0：

            - Windows 安装向导可以分别选择程序目录和漫画数据目录。设置里可以更改数据目录、打开漫画目录、导入文件夹或 zip / cbz、查看占用，并只清理封面缓存。
            - 首页有推荐关键词、分类、每日最新和收藏最多。搜索后可以按排序和时间筛选。
            - 取消下载会先确认。确认后删除这次已下载的文件；点「留下」则继续。暂停保留已下的页。
            - 会记住较快的官方线路，列表和封面可以先用缓存。设置里的 HTTP 或 HTTPS 代理默认关闭。

            阅读器仍是 2.1.0 那套：打开就是页面，点中间或按 Esc 才出工具条。底栏是上一话、页码滑块和下一话。

            - `JMComicReader-2.2.0-arm64.apk`：Android arm64 安装包。引擎嵌在应用里。
            - `JMComicReader-Setup-v2.2.0.exe`：Windows 安装程序。装好后打开的是本机窗口，`jmengine.exe` 在主程序旁边。

            下载的漫画保存在数据目录里，更新安装不会删除它们。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
